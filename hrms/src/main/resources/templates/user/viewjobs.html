<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{user/userbase :: layout(~{::main})}">
<body>
 <main class="py-3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <style>
    .bg-gradient-blue {
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 50%, #3b82f6 100%);
    }

    .table-header-blue {
      background: linear-gradient(135deg, #1e3a8a, #2563eb) !important;
      color: #ffffff !important;
    }
  </style>

  <div class="container-fluid px-4" style="max-width: 1200px;">
    
    <!-- Top Blue Gradient Banner -->
    <div class="card bg-gradient-blue text-white border-0 rounded-2 shadow-sm mb-4">
      <div class="card-body p-4 d-flex justify-content-between align-items-center">
        <div class="d-flex align-items-center gap-3">
          <div class="bg-white bg-opacity-20 rounded-2 p-3 d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
            <i class="fa-solid fa-briefcase fs-3 text-white"></i>
          </div>
          <div>
            <h2 class="h4 fw-bold mb-1 text-white">Posted Jobs</h2>
            <p class="mb-0 text-white-50 small">Explore available career opportunities and apply today</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Alert / Success Message Box -->
    <div th:if="${msg}" class="alert alert-success alert-dismissible fade show rounded-2 border-0 shadow-sm mb-4" role="alert">
      <i class="fa-solid fa-circle-check me-2"></i>
      <span th:text="${msg}" class="fw-medium"></span>
    </div>

    <!-- Main Table Container -->
    <div class="card border-0 shadow-sm rounded-2 overflow-hidden mb-4">
      
      <!-- Card Header -->
      <div class="card-header bg-white p-3 px-4 d-flex justify-content-between align-items-center border-bottom">
        <div class="d-flex align-items-center gap-2">
          <i class="fa-solid fa-building-user text-primary fs-5"></i>
          <div>
            <h5 class="fw-bold mb-0 text-dark" style="font-size: 16px;">Job Openings</h5>
            <span class="text-muted small" style="font-size: 12px;">Active job listings available for candidates</span>
          </div>
        </div>
      </div>

      <!-- Search & Control Options Bar -->
      <div class="px-4 py-2 bg-light border-bottom d-flex justify-content-between align-items-center flex-wrap gap-2">
        <div class="d-flex align-items-center gap-2 text-muted small">
          <span>Show</span>
          <select class="form-select form-select-sm rounded-2" style="width: 70px;">
            <option>10</option>
            <option>25</option>
            <option>50</option>
          </select>
          <span>entries</span>
        </div>
        <div>
          <div class="input-group input-group-sm border rounded-2 px-2 py-1 bg-white align-items-center">
            <i class="fa-solid fa-magnifying-glass text-muted me-2"></i>
            <input type="text" class="form-control border-0 p-0 shadow-none" placeholder="Search jobs..." style="font-size: 13px; width: 180px;">
          </div>
        </div>
      </div>

      <!-- Dynamic Thymeleaf Data Table -->
      <div class="table-responsive">
        <table class="table table-hover align-middle mb-0">
          <thead>
            <tr class="table-header-blue text-uppercase small" style="font-size: 11px; letter-spacing: 0.5px;">
              <th class="py-3 px-4"><i class="fa-solid fa-hashtag me-1"></i> ID</th>
              <th class="py-3"><i class="fa-solid fa-user-doctor me-1"></i> TITLE</th>
              <th class="py-3"><i class="fa-solid fa-align-left me-1"></i> DESCRIPTION</th>
              <th class="py-3"><i class="fa-solid fa-location-dot me-1"></i> LOCATION</th>
              <th class="py-3"><i class="fa-solid fa-indian-rupee-sign me-1"></i> SALARY</th>
              <th class="py-3"><i class="fa-solid fa-clock me-1"></i> JOB TYPE</th>
              <th class="py-3"><i class="fa-solid fa-calendar-xmark me-1"></i> LAST DATE</th>
              <th class="py-3"><i class="fa-solid fa-calendar-check me-1"></i> POST DATE</th>
              <th class="py-3 text-center"><i class="fa-solid fa-paper-plane me-1"></i> APPLY</th>
            </tr>
          </thead>
          <tbody>
            <!-- Empty Check to Prevent 500 Error when DB is Empty -->
            <tr th:if="${#lists.isEmpty(jinfo)}">
              <td colspan="9" class="text-center py-4 text-muted fw-bold">
                No jobs posted yet!
              </td>
            </tr>

            <tr th:each="job : ${jinfo}">
              <td class="px-4">
                <span class="badge bg-light text-primary border rounded-2 px-3 py-2 fw-bold" th:text="${job.id}"></span>
              </td>
              <td>
                <span class="fw-bold text-dark" th:text="${job.title}"></span>
              </td>
              <td>
                <span class="text-secondary small fw-medium" th:text="${job.description}"></span>
              </td>
              <td>
                <span class="badge bg-primary bg-opacity-10 text-primary rounded-2 px-3 py-2 fw-medium">
                  <i class="fa-solid fa-location-dot me-1"></i><span th:text="${job.location != null ? job.location : ''}"></span>
                </span>
              </td>
              <td>
                <span class="fw-bold text-success" th:text="${job.salary != null ? job.salary : ''}"></span>
              </td>
              <td>
                <span class="badge bg-info bg-opacity-10 text-info border border-info border-opacity-25 rounded-2 px-3 py-2 fw-semibold text-uppercase" style="font-size: 10px;" th:text="${job.jobtype != null ? job.jobtype : ''}"></span>
              </td>
              <td>
                <span class="badge bg-danger bg-opacity-10 text-danger border border-danger border-opacity-25 rounded-2 px-3 py-2 fw-semibold" th:text="${job.lastdate != null ? job.lastdate : ''}"></span>
              </td>
              <td>
                <span class="badge bg-warning bg-opacity-10 text-warning border border-warning border-opacity-25 rounded-2 px-3 py-2 fw-semibold" th:text="${job.postdate != null ? job.postdate : ''}"></span>
              </td>
              <td class="text-center">
                <a th:href="@{/user/applyjob/{id}(id=${job.id})}" class="btn btn-success btn-sm rounded-2 px-3 fw-bold">
                  <i class="fa-solid fa-paper-plane me-1"></i> Apply
                </a>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Table Footer / Pagination Bar -->
      <div class="card-footer bg-white p-3 px-4 border-top d-flex justify-content-between align-items-center flex-wrap gap-2">
        <span class="text-muted small">Showing entries</span>
        <div class="d-flex gap-1">
          <button class="btn btn-sm btn-light border rounded-2 px-2 disabled"><i class="fa-solid fa-chevron-left"></i></button>
          <button class="btn btn-sm btn-primary rounded-2 px-3 fw-bold">1</button>
          <button class="btn btn-sm btn-light border rounded-2 px-2 disabled"><i class="fa-solid fa-chevron-right"></i></button>
        </div>
      </div>

    </div>

  </div>
 </main>
</body>
</html>
