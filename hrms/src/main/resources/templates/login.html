<html lang="en" th:replace="~{base::layout(~{::main})}">
<body class="p-0 m-0">
    <main>

        <!-- Main Wrapper -->
        <div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center bg-light py-5">
            
            <!-- Main Form Wrapper -->
            <form method="post" th:action="@{/login}" class="m-0 w-100 d-flex justify-content-center">

                <!-- Split Screen Card Container -->
                <div class="card border-0 shadow-lg overflow-hidden" style="border-radius: 20px; max-width: 900px; width: 100%;">
                    <div class="row g-0">

                        <!-- 1. Left Side Blue Gradient Box -->
                        <div class="col-md-6 text-white p-4 p-md-5 d-flex flex-column justify-content-center" 
                             style="background: linear-gradient(135deg, #1d4ed8, #2563eb) !important; transition: transform 0.3s ease;"
                             onmouseover="this.style.transform='translateY(-3px)'" 
                             onmouseout="this.style.transform='translateY(0px)'">
                            
                            <!-- Shield Icon Box -->
                            <div class="d-flex align-items-center justify-content-center mb-4" 
                                 style="width: 48px; height: 48px; background: rgba(255, 255, 255, 0.2); border-radius: 12px;">
                                <i class="fa-solid fa-shield-halved fs-4 text-white"></i>
                            </div>

                            <h2 class="text-white mb-2 fw-bold">Welcome back...</h2>

                            <p class="text-white-50 small mb-4" style="line-height: 1.6;">
                                Sign in to manage your workspace, track your team<br class="d-none d-lg-block">
                                and stay on top of everything that matters.
                            </p>

                            <!-- Checklist Features -->
                            <div class="d-flex flex-column gap-3 small">
                                <div class="d-flex align-items-center gap-2">
                                    <i class="fa-regular fa-circle-check fs-5 text-white"></i>
                                    <span class="fw-semibold text-white">Secure role-based access</span>
                                </div>

                                <div class="d-flex align-items-center gap-2">
                                    <i class="fa-regular fa-circle-check fs-5 text-white"></i>
                                    <span class="fw-semibold text-white">Built for admin &amp; Employees</span>
                                </div>

                                <div class="d-flex align-items-center gap-2">
                                    <i class="fa-regular fa-circle-check fs-5 text-white"></i>
                                    <span class="fw-semibold text-white">Fast, Reliable, Always Available</span>
                                </div>
                            </div>

                        </div>

                        <!-- 2. Right Side Form Box -->
                        <div class="col-md-6 bg-white p-4 p-md-5 d-flex flex-column justify-content-center"
                             style="transition: transform 0.3s ease;"
                             onmouseover="this.style.transform='translateY(-3px)'" 
                             onmouseout="this.style.transform='translateY(0px)'">

                            <h2 class="fw-bold text-dark mb-1">Login</h2>
                            <p class="text-secondary small mb-3">Enter your credentials to continue</p>

                            <!-- Backend Error Message Block -->
                            <div th:if="${msg}" class="mb-3">
                                <p style="color:red;" class="small fw-semibold m-0" th:text="${msg}"></p>
                            </div>

                            <!-- User ID Field -->
                            <div class="mb-3">
                                <label for="exampleFormControlInput1" class="form-label text-dark small fw-semibold">User ID</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-regular fa-user"></i></span>
                                    <input
                                        type="email"
                                        id="exampleFormControlInput1"
                                        name="emailaddress"
                                        class="form-control py-2 border-start-0 bg-light"
                                        placeholder="Enter User ID"
                                        required>
                                </div>
                            </div>

                            <!-- Password Field -->
                            <div class="mb-4">
                                <label for="inputPassword5" class="form-label text-dark small fw-semibold">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0 text-muted"><i class="fa-solid fa-lock"></i></span>
                                    <input
                                        type="password"
                                        id="inputPassword5"
                                        name="password"
                                        class="form-control py-2 border-start-0 bg-light"
                                        placeholder="Enter Password"
                                        aria-describedby="passwordHelpBlock"
                                        required>
                                </div>
                                <div id="passwordHelpBlock" class="form-text"></div>
                            </div>

                            <!-- Login Button (Anchor Tag) -->
                            <a th:href="@{/login}" onclick="this.closest('form').submit(); return false;" class="btn btn-primary w-100 rounded-3 py-2 fw-semibold mb-3 d-flex align-items-center justify-content-center gap-2">
                                <span>Login</span>
                                <i class="fa-solid fa-arrow-right fs-6"></i>
                            </a>

                            <!-- Forgot Password Link -->
                            <div class="text-center">
                                <a href="#" class="text-primary text-decoration-none small fw-semibold">
                                    Forgot Password?
                                </a>
                            </div>

                        </div>

                    </div>
                </div>

            </form>

        </div>

         <script src="./js/bootstrap.bundle.js"></script>
    </main>
</body>
</html>
