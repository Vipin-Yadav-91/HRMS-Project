<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
 <main class="container-fluid px-4 py-3">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .page-banner {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%) !important;
            color: #ffffff !important;
            border-radius: 16px;
            padding: 20px 25px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
        }

        .custom-card {
            background: #ffffff;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%) !important;
        }

        .custom-table thead th {
            color: #ffffff !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            padding: 14px 15px;
            border: none;
            white-space: nowrap;
        }

        .custom-table td {
            padding: 14px 15px;
            vertical-align: middle;
            color: #334155;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }

        /* Row hover effect */
        .custom-table tbody tr {
            transition: all 0.2s ease;
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }

        .job-id-badge {
            background-color: #e0e7ff;
            color: #4338ca;
            font-weight: 600;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
        }
    </style>

  
    <div class="page-banner mb-4 d-flex align-items-center">
        <div class="bg-white bg-opacity-25 rounded-circle p-3 me-3 text-white d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            <i class="fa-solid fa-briefcase fs-4"></i>
        </div>
        <div>
            <h3 class="m-0 fw-bold fs-4 text-white">Posted Jobs</h3>
            <p class="m-0 text-white-50 small">Manage and track all active job postings</p>
            
        </div>
    </div>
<div th:if="${msg}" class="text-center">
      <span th:text="${msg}" class="fs-6 fw-bolder bg-danger text-center rounded-3 text-white py-2 px-2" style="text-align:center;"></span>
      
      </div>
   
    <div class="custom-card">
        <div class="d-flex align-items-center mb-3">
            <i class="fa-solid fa-list-check me-2 fs-5 text-primary"></i>
            <h5 class="fw-bold m-0 text-dark">Job Listings</h5>
        </div>
        
        <div class="table-responsive rounded-3">
            <table class="table custom-table align-middle mb-0">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Description</th>
                        <th>Location</th>
                        <th>Salary</th>
                        <th>Job Type</th>
                        <th>Last Date</th>
                        <th>Post Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="job : ${postedJobs}">
                        <td><span class="job-id-badge" th:text="${job.id}"></span></td>
                        <td class="fw-semibold text-dark" th:text="${job.title}"></td>
                        <td th:text="${job.description}"></td>
                        <td><i class="fa-solid fa-location-dot me-1 text-muted"></i><span th:text="${job.location}"></span></td>
                        <td class="fw-bold text-success" th:text="${job.salary}"></td>
                        <td><span class="badge bg-light text-dark border" th:text="${job.jobtype}"></span></td>
                        <td th:text="${job.lastdate}"></td>
                        <td th:text="${job.postdate}"></td>
             <td>
      <a th:href="@{/admin/deletejob(id=${job.id})}" class="btn btn-danger btn-sm">
        Delete
      </a>
    </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

 </main>
</body>
</html>
