<html lang="en" th:replace="~{admin/adminbase :: layout(~{::main})}">
<body>
 <main class="container-fluid px-4 py-3">

    <!-- CSS Links & Styles inside <main> so Thymeleaf layout dialect includes them -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        .page-banner {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%) !important;
            color: white !important;
            border-radius: 16px;
            padding: 20px 25px;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.15);
        }

        .custom-card {
            background: #ffffff;
            border-radius: 16px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            padding: 20px;
        }

        .custom-table thead {
            background: linear-gradient(135deg, #2563eb 0%, #4f46e5 50%, #7c3aed 100%) !important;
        }

        .custom-table thead th {
            color: #ffffff !important;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.82rem;
            letter-spacing: 0.5px;
            padding: 14px 15px;
            border: none;
        }

        .custom-table td {
            padding: 14px 15px;
            vertical-align: middle;
            color: #334155;
            font-size: 0.9rem;
            border-bottom: 1px solid #f1f5f9;
        }

        .custom-table tbody tr:hover {
            background-color: #f8fafc;
        }
    </style>

    <!-- Top Gradient Banner -->
    <div class="page-banner mb-4 d-flex align-items-center">
        <div class="bg-white bg-opacity-25 rounded-circle p-3 me-3 text-white d-flex align-items-center justify-content-center" style="width: 48px; height: 48px;">
            <i class="fa-solid fa-users-viewfinder fs-4"></i>
        </div>
        <div>
            <h3 class="m-0 fw-bold fs-4 text-white">View Job Seeker</h3>
            <p class="m-0 text-white-50 small">Manage and view job seeker records</p>
        </div>
    </div>

    <!-- Table Card Section -->
    <div class="custom-card">
        <div class="d-flex align-items-center mb-3">
            <i class="fa-solid fa-list-check me-2 fs-5 text-primary"></i>
            <h5 class="fw-bold m-0 text-dark">Job Seeker Records</h5>
        </div>
        
        <div class="table-responsive rounded-3">
            <table class="table custom-table align-middle mb-0">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Contact no</th>
                        <th>Email Address</th>
                        <th>Qualification</th>
                        <th>Experience</th>
                        <th>Key Skills</th>
                        <th>Address</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="user:${users}">
                        <td th:text="${user.name}"></td>
                        <td th:text="${user.gender}"></td>
                        <td th:text="${user.contactno}"></td>
                        <td th:text="${user.emailaddress}"></td>
                        <td th:text="${user.qualification}"></td>
                        <td th:text="${user.experience}"></td>
                        <td th:text="${user.keyskill}"></td>
                        <td th:text="${user.address}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

 </main>
</body>
</html>
